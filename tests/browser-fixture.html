<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Extensao-dark — cenário de comparação P3</title>
  <style>
    :root { --panel: rgb(245,245,245); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; font: 16px/1.5 Arial, sans-serif; background: rgb(255,255,255); color: rgb(20,20,20); }
    main { width: min(720px, 100%); margin: 0 auto; }
    .card { background: var(--panel); color: rgb(30,30,30); padding: 24px; border: 1px solid rgb(185,185,185); border-radius: 12px; }
    .card p { margin: 0.5em 0; }
    .badge { background: rgb(8,115,235); color: white; display: inline-block; padding: 6px 12px; border-radius: 10px; }
    button { border: 2px solid rgb(160,160,160); padding: 10px 18px; background: rgb(240,240,240); color: rgb(28,28,28); }
    button.selected { background: rgb(8,115,235); color: white; border-color: rgb(8,115,235); }
    #muted-tab { background:rgb(180,180,182);color:rgb(20,20,20);border-color:rgb(130,130,132) }
    .translucent { background: rgba(255,255,255,0.75); color: rgb(25,25,25); padding: 8px; }
    .controls { display: flex; align-items:center; gap:12px; flex-wrap:wrap; margin: 20px 0; }
    .masked-icon {display:inline-block;width:30px;height:30px;background-color:rgb(240,240,240);
      -webkit-mask-image:linear-gradient(#000,#000);mask-image:linear-gradient(#000,#000);
      -webkit-mask-size:100% 100%;mask-size:100% 100%;}
    img { width: 42px; height: 42px; }
    html[dark] body { background: rgb(22,23,25); color: rgb(236,236,236); }
    html[dark] .card { background: rgb(38,39,42); color: rgb(237,237,237); border-color: rgb(80,80,80); }
    html[dark] .translucent { background: rgba(35,35,35,.8); color:rgb(230,230,230); }
    html[dark] button:not(.selected) { background: rgb(46,46,49); color: rgb(233,233,233); border-color: rgb(115,115,115); }
  </style>
</head>
<body>
  <main id="app">
    <h1>Teste de modo escuro</h1>
    <section class="card" id="card"><h2>Cartão com variável CSS</h2><p id="copy">Texto legível sobre fundo claro</p><div class="translucent" id="translucent">Fundo com transparência</div></section>
    <div class="controls"><button id="muted-tab" role="tab" aria-selected="true">Aba neutra ativa</button><button id="action">Selecionar aba</button><span class="badge" id="badge">8 notificações</span><input aria-label="Pesquisa" placeholder="Digite aqui"></div>
    <div style="display:inline-flex;align-items:center;gap:12px;background-color:rgb(28,28,30);padding:12px" aria-label="Exemplo de ícone claro no fundo escuro">
      <span class="masked-icon" id="masked-icon" aria-label="Ícone mascarado"></span>
    </div>
    <img id="image" alt="Ícone de teste" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 42'%3E%3Ccircle cx='21' cy='21' r='18' fill='%23ef5544'/%3E%3C/svg%3E">
    <div id="shadow-host"></div>
    <div id="dynamic"></div>
  </main>
  <script>
    const host = document.querySelector('#shadow-host');
    const shadow = host.attachShadow({mode:'open'});
    shadow.innerHTML = '<style>.shadow-card { background:rgb(246,246,246); color:rgb(17,17,17);padding:10px }</style><div class="shadow-card">Componente encapsulado</div>';
    window.__fixtureReady = true;
    window.fixtureAction = () => {
      document.querySelector('#action').classList.toggle('selected');
      document.querySelector('#dynamic').innerHTML = '<article class="card" id="inserted">Adicionado dinamicamente</article>';
      document.documentElement.style.setProperty('--panel','rgb(238,238,238)');
    };
    window.fixtureNativeDark = () => document.documentElement.setAttribute('dark', '');
    window.fixtureNativeLight = () => document.documentElement.removeAttribute('dark');
  </script>
</body>
</html>
