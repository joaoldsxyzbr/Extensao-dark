name: Navegador real e comparação visual

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validar extração segura antes dos downloads
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Preparar Chrome for Testing e Dark Reader oficial em perfis isolados
        run: python3 scripts/prepare-browser-fixtures.py
      - name: Executar navegador real e comparar capturas
        run: node scripts/browser-e2e.js --output=browser-results --compare-extension="$DARK_READER_TEST_PATH"
      - name: Treinar P7 e P8 somente para auditoria em modo sombra
        run: |
          node scripts/export-neural-color-features.js
          python3 -m training.train_neural_colors --output data/neural-color-ci-candidate.json --epochs 5
          node scripts/generate-p8-hard-negatives.js
          python3 -m training.train_neural_colors_p8 --output data/neural-color-p8-ci-candidate.json --epochs 8
      - name: Observar decisoes P7 P8 em paginas publicas sem aplicar estilos
        run: node scripts/p9-real-site-shadow.js --output=browser-results/p9-shadow --sites=example,wikipedia,mdn,github,roblox,youtube
      - name: Renderizar P7 P8 apenas no Chromium efemero e restaurar CSS
        run: node scripts/p9-visual-candidates.js --output=browser-results/p9-visual --sites=example,wikipedia,mdn,github
      - name: Treinar candidato P11 isolado para comparacao visual P12
        run: |
          node scripts/p11-generate-descendant-data.js
          python3 -m training.train_p11_descendant --epochs 12
      - name: Comparar P11 com professor seguro em templates locais novos
        run: node scripts/p12-descendant-browser.js --output=browser-results/p12-descendant
      - name: Auditar P11 em domínios públicos inéditos (modo sombra sem conteúdo)
        run: node scripts/p12-public-site-audit.js
      - name: Renderizar P11 e professor em DOM publico isolado sem extensao
        run: node scripts/p12-public-render-p11.js
      - name: Preparar corpus contextual e treinar candidato P2 apenas para teste
        run: |
          node scripts/export-contextual-features.js
          python3 -m training.train_contextual --output data/contextual-ci-candidate.json --epochs 65
      - name: Coletar observações em páginas públicas reais com perfis isolados
        run: node scripts/real-site-lab.js --output=browser-results --sites=example,wikipedia,github,mdn,roblox,youtube
      - name: Comparar modo global em sites com temas nativos
        run: node scripts/real-site-lab.js --force-native --output=browser-results/native-forced --sites=roblox,youtube,github
      - name: Comparar métricas sintéticas do P2 antes do gate P4
        run: node scripts/evaluate-contextual.js
      - name: Medir custo de inferência do candidato
        run: node scripts/p4-neural-benchmark.js --output=browser-results/p4-neural-benchmark.json
      - name: Auditar elegibilidade de promoção e manter revisão humana
        run: |
          node scripts/p4-release-gate.js --synthetic=data/contextual-ci-report.json --benchmark=browser-results/p4-neural-benchmark.json --automatic=browser-results/real-sites-report.json --forced=browser-results/native-forced/real-sites-report.json --output=browser-results/p4-release-gate.json
      - name: Salvar relatórios e capturas de teste
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-comparacao
          path: browser-results/
          if-no-files-found: warn
          retention-days: 7
