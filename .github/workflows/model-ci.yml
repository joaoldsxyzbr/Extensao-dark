name: Treinamento e qualidade da extensão

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  treino-e-testes:
    name: Treinar e validar modelo local
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validar contrato P14, privacidade e isolamento de holdout
        run: |
          node scripts/p14-dataset-contract.js
          node scripts/p14-benchmark-contract.js
          node scripts/p14-public-domains.js
          node scripts/p14-independent-reviews.js
      - name: Confirmar motor versionado e vetores de treino
        run: |
          node scripts/build-neural.js --check
          node scripts/export-neural-features.js --check
      - name: Gerar corpus contextual supervisionado P2
        run: node scripts/export-contextual-features.js
      - name: Gerar e auditar corpus CSS avançado P5/P6 (sem treino novo)
        run: node scripts/generate-css-lab.js --output=training/css-advanced-features.json
      - name: Arquivar corpus exploratório CSS P5/P6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: css-advanced-exploratory-corpus-not-deployed
          path: training/css-advanced-features.json
          if-no-files-found: error
          retention-days: 7
      - name: Gerar exemplos sintéticos P7 de cores neurais (não publicados)
        run: node scripts/export-neural-color-features.js
      - name: Treinar candidato P7 de previsão RGB com Neural Core P15
        run: python3 -m training.train_neural_colors --output data/neural-color-ci-candidate.json --metrics data/neural-color-ci-metrics.json --epochs 5
      - name: Avaliar candidato neural RGB sem implantar pesos
        run: node scripts/evaluate-neural-colors.js
      - name: Gerar negativos translúcidos somente de famílias de treino
        run: node scripts/generate-p8-hard-negatives.js --output=training/neural-color-p8-hard-negatives.json
      - name: Treinar candidato P8 com redes BCE e RGB MSE (não publicado)
        run: python3 -m training.train_neural_colors_p8 --output data/neural-color-p8-ci-candidate.json --metrics data/neural-color-p8-ci-metrics.json --epochs 8
      - name: Comparar P7 e P8 em conjuntos sintéticos separados
        run: node scripts/evaluate-neural-colors-p8.js
      - name: Avaliar P7 e P8 em cenários CSS manuais externos ao treinamento (sem publicação)
        run: node scripts/evaluate-neural-colors-p9.js
      - name: Gerar corpus sintético P11 de superfícies e textos descendentes
        run: node scripts/p11-generate-descendant-data.js
      - name: Treinar modelo P11 de cor descendente sem publicar
        run: python3 -m training.train_p11_descendant --epochs 12
      - name: Comparar inferência P11 Python e JavaScript em famílias isoladas
        run: node scripts/p11-evaluate-descendant.js
      - name: Arquivar candidato P11 exclusivamente experimental
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p11-descendant-neural-not-deployed
          path: |
            data/p11-descendant-ci-candidate.json
            data/p11-descendant-ci-metrics.json
            data/p11-descendant-ci-audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Arquivar relatório P8 e modelos exclusivamente experimentais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p8-two-head-neural-color-candidate-not-deployed
          path: |
            data/neural-color-p8-ci-candidate.json
            data/neural-color-p8-ci-metrics.json
            data/neural-color-p8-ci-comparison.json
            data/p9-manual-qa-ci.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Arquivar somente candidato experimental P7
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p7-neural-color-candidate-not-deployed
          path: |
            data/neural-color-ci-candidate.json
            data/neural-color-ci-metrics.json
            data/neural-color-ci-evaluation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Treinar um modelo candidato com Python (sem substituir pesos distribuídos)
        run: python3 -m training.train_dark --output data/neural-ci-candidate.json
      - name: Verificar pesos distribuídos reproduzíveis em Python e JS
        run: node scripts/verify-neural-model.js
      - name: Testar treinamento Python da extensão
        run: python3 -m unittest discover -s training_tests -v
      - name: Avaliar modelo em exemplos separados
        run: node scripts/evaluate-neural.js
      - name: Validar catálogo visual P0 reproduzível
        run: node scripts/visual-corpus-report.js --check
      - name: Treinar candidato P2 de 18 entradas sem promover pesos
        run: python3 -m training.train_contextual --output data/contextual-ci-candidate.json --metrics data/contextual-ci-metrics.json
      - name: Comparar P2 contra baseline em JavaScript
        run: node scripts/evaluate-contextual.js
      - name: Medir custo da inferência e orçamento P4
        run: node scripts/p4-neural-benchmark.js --output=data/p4-ci-benchmark.json
      - name: Registrar gate P4 sem liberar publicação de pesos
        run: node scripts/p4-release-gate.js --synthetic=data/contextual-ci-report.json --benchmark=data/p4-ci-benchmark.json --output=data/p4-ci-gate.json
      - name: Arquivar candidato P2 somente para auditoria
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contextual-neural-candidate-not-deployed
          path: |
            data/contextual-ci-candidate.json
            data/contextual-ci-metrics.json
            data/contextual-ci-report.json
            data/p4-ci-benchmark.json
            data/p4-ci-gate.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Executar testes de regressão
        run: node --test
      - name: Validar extração segura de downloads (Python stdlib)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validar sintaxe JavaScript
        run: |
          for file in content/*.js popup/*.js scripts/*.js tests/*.js vendor/neural_core/neural-core.js; do
            node --check "$file"
          done
      - name: Validar manifesto e referência aos ícones
        run: node --test tests/manifest.test.js
